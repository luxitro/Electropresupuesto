<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ElectroPresup.">
<title>ElectroPresupuesto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra inferior en celular, menú lateral en pantallas anchas; contenido en tarjetas sobre fondo azulado. */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#F1F5FB; --ink:#102A50; --mute:#5D7190; --line:#DCE6F3;
  --chrome:#0B1B33; --chrome-ink:#EAF0FA; --chrome-mute:#9FB1CB;
  --yellow:#1463F3; --yellow-ink:#FFFFFF; --link:#1463F3;
  --ok:#0E8A58; --ok-bg:#E1F6EC; --warn:#9A6200; --warn-bg:#FEF1D6; --bad:#DC3545; --bad-bg:#FCE8EA; --info:#1463F3; --info-bg:#E6EFFE;
  --paper:#FFFFFF; --paper-ink:#1A2433; --paper-mute:#5B6B80; --paper-line:#D5DCE6; --paper-soft:#F3F5F9;
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111F; --surface:#0F1E33; --surface-2:#152842; --ink:#E8EEF8; --mute:#9AAAC0; --line:#24395A;
  --chrome:#0A1830; --link:#8DB8FF;
  --ok:#62D69C; --ok-bg:#10301F; --warn:#FFD25A; --warn-bg:#392D0A; --bad:#FF918A; --bad-bg:#3A1612; --info:#92BBFF; --info-bg:#14294D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111F; --surface:#0F1E33; --surface-2:#152842; --ink:#E8EEF8; --mute:#9AAAC0; --line:#24395A;
  --chrome:#0A1830; --link:#8DB8FF;
  --ok:#62D69C; --ok-bg:#10301F; --warn:#FFD25A; --warn-bg:#392D0A; --bad:#FF918A; --bad-bg:#3A1612; --info:#92BBFF; --info-bg:#14294D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--chrome);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;line-height:1.1}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome);color:var(--chrome-ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;min-width:0}
.brand>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .btn{flex:none}
.brand-mark{width:34px;height:34px;border-radius:6px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--chrome-mute);text-transform:uppercase;line-height:1}
.brand b{display:block;line-height:1}
main{flex:1;min-width:0;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--chrome);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-top:2px solid var(--yellow)}
.nav button{flex:1;min-width:0;background:none;border:0;color:var(--chrome-mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:54px;cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:8px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--yellow)}
.nav .brandrow{display:none}
.nav button.hm{display:none}.nav .l-l{display:none}
.paybar{border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.paybar h2{font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.paybar p{margin-top:2px}
.paybar.pend{background:var(--yellow);color:var(--yellow-ink)}
.paybar.paid{background:var(--ok-bg);color:var(--ok)}
.stats.s3 .stat:last-child{grid-column:1/-1}
@media (min-width:760px){.stats.s3{grid-template-columns:repeat(3,1fr)}.stats.s3 .stat:last-child{grid-column:auto}}

@media (min-width:900px){
  #app{flex-direction:row}
  .topbar{display:none}
  body::before{display:none}
  .nav{position:sticky;top:0;align-self:flex-start;height:100vh;width:236px;flex:none;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:2px solid var(--yellow);
    padding:18px 12px;color:var(--chrome-ink)}
  .nav button.hd{display:none}.nav button.hm{display:flex}.nav .l-l{display:inline}.nav .l-s{display:none}
  .nav .brandrow{display:flex;color:var(--chrome-ink);padding:4px 8px 18px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:0 12px;min-height:48px;justify-content:flex-start}
  main{padding-block:28px 60px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.flat{background:var(--surface-2)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:32px}
.ph p{color:var(--mute)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .ico{width:30px;height:30px;border-radius:6px;background:var(--chrome);color:var(--yellow);display:grid;place-items:center;flex:none}
.sec-h .ico svg{width:18px;height:18px}
.sec-h h2{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.sec-h .sp{flex:1}
.hint{color:var(--mute);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{border-color:var(--link)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--chrome);border-color:var(--chrome);color:var(--chrome-ink)}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:0 12px;font-size:16px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-b{display:flex;gap:10px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.05;overflow-wrap:anywhere}
.stat .v.money{font-size:30px}
.stat .n{font-size:13px;color:var(--mute)}
.stat.hl{background:var(--chrome);border-color:var(--chrome);color:var(--chrome-ink)}
.stat.hl .k,.stat.hl .n{color:var(--chrome-mute)}
.stat.hl .v{color:var(--yellow)}

.actions{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.actions{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.actions{grid-template-columns:repeat(3,1fr)}}
.act{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:76px;cursor:pointer;width:100%}
.act:hover{border-color:var(--link)}
.act .ico{width:44px;height:44px;border-radius:8px;background:var(--surface-2);color:var(--link);display:grid;place-items:center;flex:none}
.act .ico svg{width:24px;height:24px}
.act.main{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.act.main .ico{background:var(--chrome);color:var(--yellow)}
.act b{display:block;font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.act span.d{display:block;font-size:14px;opacity:.8}

.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:var(--mute)}
.steps .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .dot svg{width:16px;height:16px}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-borrador{background:var(--surface-2);color:var(--mute);border:1px solid var(--line)}
.b-enviado{background:var(--info-bg);color:var(--info)}
.b-aceptado{background:var(--yellow);color:var(--yellow-ink)}
.b-pagado{background:var(--ok-bg);color:var(--ok)}
.b-rechazado{background:var(--bad-bg);color:var(--bad)}
.b-vencido{background:var(--warn-bg);color:var(--warn)}

.list{display:flex;flex-direction:column;gap:10px}
.qi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;width:100%;cursor:pointer}
.qi:hover{border-color:var(--link)}
.qi .no{font-family:var(--f-display);font-weight:700;font-size:20px}
.qi .tot{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right}
.qi .meta{color:var(--mute);font-size:14px;min-width:0;overflow-wrap:anywhere}
.qi .r2{display:flex;justify-content:flex-end}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--chrome);border-color:var(--chrome);color:var(--yellow)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mute)}
.empty svg{width:40px;height:40px;color:var(--link)}
.empty h3{color:var(--ink);font-size:24px}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.03em;text-transform:uppercase}
.inp,.sel,.txt{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;color:var(--ink)}
.txt{padding:10px 12px;min-height:88px;resize:vertical}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--link);outline:2px solid var(--link);outline-offset:0}
.inp[aria-invalid="true"],.sel[aria-invalid="true"],.txt[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:500}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.span2{grid-column:1/-1}
.adorn{position:relative}
.adorn .inp{padding-right:40px}
.adorn i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-weight:600;pointer-events:none}
.adorn.pre .inp{padding-left:30px;padding-right:12px}
.adorn.pre i{right:auto;left:12px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--chrome)}

.ed-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (min-width:900px){.ed-bar{top:0}}
.ed-bar .t{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase}
.ed-bar .tot{font-family:var(--f-display);font-weight:700;font-size:26px;white-space:nowrap}
.irow{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.irow-h{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
.irow-h span{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--mute)}
.ig{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.ig .w{grid-column:1/-1}
.ig .sub{display:flex;flex-direction:column;gap:5px;justify-content:flex-end}
.ig .sub b{font-family:var(--f-display);font-size:24px;min-height:48px;display:flex;align-items:center;justify-content:flex-end}
@media (min-width:760px){
  .ig.m{grid-template-columns:repeat(12,1fr)}.ig.m .w{grid-column:span 5}.ig.m .q{grid-column:span 2}.ig.m .u{grid-column:span 2}.ig.m .p{grid-column:span 3}.ig.m .sub{grid-column:span 3}
  .ig.l{grid-template-columns:repeat(12,1fr)}.ig.l .w{grid-column:span 6}.ig.l .q{grid-column:span 2}.ig.l .p{grid-column:span 2}.ig.l .sub{grid-column:span 2}
}
.sumbox{display:flex;flex-direction:column;gap:2px}
.sl{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.sl.strong{font-weight:600}
.sl.total{border:0;background:var(--chrome);color:var(--yellow);padding:12px 14px;border-radius:8px;margin-top:8px;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.sl span:last-child{text-align:right}

.alert{border-radius:8px;padding:12px 14px;display:flex;gap:10px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert ul{margin:4px 0 0;padding-left:18px}
.alert svg{width:22px;height:22px;flex:none;margin-top:1px}

.tw{overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:clamp(16px,4vw,36px);font-size:14px;max-width:820px;margin:0 auto;width:100%;min-width:0}
.paper .hd{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:4px solid var(--yellow)}
.paper .biz{display:flex;gap:12px;align-items:flex-start;min-width:0}
.paper .biz img{max-width:84px;max-height:72px;object-fit:contain}
.paper .biz h2{font-size:26px;color:#0B1F3A}
.paper .biz p{color:var(--paper-mute);font-size:13px}
.paper .qno{text-align:right}
.paper .qno h2{font-size:30px;color:#0B1F3A;letter-spacing:.06em}
.paper .qno p{font-size:13px;color:var(--paper-mute)}
.paper .two{display:grid;gap:12px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:600px){.paper .two{grid-template-columns:1fr 1fr}}
.paper .bx{background:var(--paper-soft);padding:10px 12px;border-radius:4px;min-width:0;overflow-wrap:anywhere}
.paper .bx h4,.paper h4.t{margin:0 0 4px;font-family:var(--f-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#0B1F3A}
.paper h4.t{margin-top:16px}
.paper table{width:100%;border-collapse:collapse;min-width:520px;margin-top:6px}
.paper th{background:#0B1F3A;color:#fff;text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:7px 8px}
.paper td{padding:7px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top;overflow-wrap:anywhere}
.paper .r{text-align:right;white-space:nowrap}
.paper .tots{margin-left:auto;width:min(100%,340px);margin-top:14px}
.paper .tots .sl{border-bottom:1px solid var(--paper-line)}
.paper .tots .sl.total{background:#0B1F3A;color:#FFC800}
.paper .cond p{margin:0 0 6px;white-space:pre-line;overflow-wrap:anywhere}
.paper .cond b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-mute)}
.paper .ft{margin-top:18px;padding-top:8px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--paper-mute)}

.pk{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:56px;cursor:pointer}
.pk:hover{border-color:var(--link)}
.pk .num{font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap}
.pkrow{display:flex;gap:8px;align-items:stretch}
.dlg.wide{max-width:560px;max-height:88vh;overflow:auto}
.dlg .list{max-height:48vh;overflow:auto}
.cat-i{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.cat-i:last-child{border-bottom:0}
.dayh{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 0}
.dayh.late{color:var(--bad)}
.bought:checked + .bt{text-decoration:line-through;opacity:.55}
.ig .cs{grid-column:1/-1}
@media (min-width:760px){.ig.m .cs{grid-column:span 9}.ig.l .cs{grid-column:span 12}}
.sl.profit{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-weight:600;border:0;margin-top:6px}
.nav button.hd{display:flex}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .tr{background:var(--surface-2);border-radius:4px;height:22px;overflow:hidden}
.bar .fi{background:var(--chrome);height:100%;min-width:2px}
.bar .vl{font-weight:600;min-width:90px;text-align:right}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .fi{background:var(--yellow)}}
:root[data-theme="dark"] .bar .fi{background:var(--yellow)}

.logo-prev{width:120px;height:90px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);color:var(--mute);font-size:13px;text-align:center;flex:none}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:8px;max-width:min(92vw,460px);font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 118px)}}

'use strict';
/* ============ Utilidades ============ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function escBr(s){return esc(s).replace(/\n/g,'<br>')}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad2(n){return String(n).padStart(2,'0')}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(iso,n){var p=iso.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function fmtDate(iso){if(!iso)return '';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
function fmtDT(iso){var d=new Date(iso);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()}
function money(c){var neg=c<0;c=Math.abs(c);var e=Math.floor(c/100),d=c%100;return (neg?'-':'')+'$ '+String(e).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad2(d)}
function fmtQty(n){var s=(Math.round(n*1000)/1000).toString().replace('.',',');return s}
function numNo(n){return String(n).padStart(4,'0')}
var MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* Lectura de números escritos a la argentina: 1.234,56 / 1234,5 / 12.5 */
function P(raw){
  var s=String(raw==null?'':raw).trim();
  if(s==='')return {empty:true,v:0};
  var t=s.replace(/\s/g,'').replace(/^\$/,''),neg=false;
  if(t.charAt(0)==='-'){neg=true;t=t.slice(1)}
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,'').replace(',','.');
  else if(/^\d+(,\d+)?$/.test(t))t=t.replace(',','.');
  else if(!/^(\d+(\.\d+)?|\.\d+)$/.test(t))return {err:'Ingresá un número válido (usá coma para los decimales)',v:0};
  var v=parseFloat(t);
  if(!isFinite(v))return {err:'Ingresá un número válido',v:0};
  if(neg&&v!==0)return {err:'No puede ser un valor negativo',v:0};
  if(v>1e11)return {err:'El valor es demasiado grande',v:0};
  return {v:v};
}

function calc(q){
  var errs={},r={};
  function E(k,m,kind){errs[k]={msg:m,kind:kind}}
  var matTotal=0,labTotal=0,items=0,costMat=0,costLab=0,costRows=0;
  r.matRows=q.mats.map(function(m){
    var blank=!m.desc.trim()&&!String(m.qty).trim()&&!String(m.price).trim();
    if(blank)return {id:m.id,blank:true,sub:0};
    items++;
    var a=P(m.qty),b=P(m.price);
    if(!m.desc.trim())E('m.'+m.id+'.desc','Escribí la descripción del material','req');
    if(a.err)E('m.'+m.id+'.qty',a.err,'inv');else if(a.empty)E('m.'+m.id+'.qty','Ingresá la cantidad','req');
    if(b.err)E('m.'+m.id+'.price',b.err,'inv');else if(b.empty)E('m.'+m.id+'.price','Ingresá el precio (0 si no tiene costo)','req');
    var sub=(a.err||b.err)?0:Math.round(a.v*Math.round(b.v*100));
    var cc=P(m.cost);if(cc.err)E('m.'+m.id+'.cost',cc.err,'inv');var rc=(cc.err||a.err)?0:Math.round(a.v*Math.round(cc.v*100));costMat+=rc;if(!cc.empty&&!cc.err)costRows++;matTotal+=sub;return {id:m.id,cost:rc,qty:a.v,priceC:Math.round(b.v*100),sub:sub,m:m};
  });
  r.labRows=q.labor.map(function(m){
    var blank=!m.desc.trim()&&!String(m.qty).trim()&&!String(m.price).trim();
    if(blank)return {id:m.id,blank:true,sub:0};
    items++;
    var a=P(m.qty),b=P(m.price);
    if(!m.desc.trim())E('l.'+m.id+'.desc','Escribí la descripción del trabajo','req');
    if(a.err)E('l.'+m.id+'.qty',a.err,'inv');
    if(b.err)E('l.'+m.id+'.price',b.err,'inv');else if(b.empty)E('l.'+m.id+'.price','Ingresá el precio','req');
    var qty=a.empty?1:a.v;
    var sub=(a.err||b.err)?0:Math.round(qty*Math.round(b.v*100));
    var cc=P(m.cost);if(cc.err)E('l.'+m.id+'.cost',cc.err,'inv');var rc=(cc.err||a.err)?0:Math.round(qty*Math.round(cc.v*100));costLab+=rc;if(!cc.empty&&!cc.err)costRows++;labTotal+=sub;return {id:m.id,cost:rc,qty:qty,qtyGiven:!a.empty,priceC:Math.round(b.v*100),sub:sub,m:m};
  });
  function ex(k,key){var p=P(q.extras[k]);if(p.err){E(key,p.err,'inv');return 0}return Math.round(p.v*100)}
  r.tras=ex('traslado','x.traslado');r.herr=ex('herr','x.herr');r.otros=ex('otros','x.otros');
  r.mat=matTotal;r.lab=labTotal;r.extras=r.tras+r.herr+r.otros;
  r.subtotal=r.mat+r.lab+r.extras;
  var dv=P(q.discount.value);r.disc=0;r.discPct=null;
  if(dv.err)E('d.value',dv.err,'inv');
  else if(q.discount.type==='porc'){
    if(dv.v>100)E('d.value','El porcentaje no puede superar 100','inv');
    else{r.disc=Math.round(r.subtotal*dv.v/100);r.discPct=dv.v}
  }else{
    var dc=Math.round(dv.v*100);
    if(dc>r.subtotal)E('d.value','El descuento no puede superar el subtotal ('+money(r.subtotal)+')','inv');
    else r.disc=dc;
  }
  r.base=r.subtotal-r.disc;r.taxAmt=0;r.taxPct=0;
  if(q.tax.on){
    if(!q.tax.name.trim())E('t.name','Indicá el nombre del impuesto','req');
    var tp=P(q.tax.pct);
    if(tp.err)E('t.pct',tp.err,'inv');else if(tp.empty)E('t.pct','Ingresá el porcentaje','req');
    else if(tp.v>100)E('t.pct','El porcentaje no puede superar 100','inv');
    else{r.taxPct=tp.v;r.taxAmt=Math.round(r.base*tp.v/100)}
  }
  r.visit=0;
  if(q.visit&&q.visit.on){var vp=P(q.visit.amount);if(vp.err)E('v.amount',vp.err,'inv');else if(vp.empty)E('v.amount','Ingresá el importe de la visita','req');else{var vc=Math.round(vp.v*100);if(vc>r.base+r.taxAmt)E('v.amount','La visita no puede superar el total del trabajo ('+money(r.base+r.taxAmt)+')','inv');else r.visit=vc}}
  r.total=r.base+r.taxAmt-r.visit;

  r.costOther=ce.err?0:Math.round(ce.v*100);r.costMat=costMat;r.costLab=costLab;r.cost=costMat+costLab+r.costOther;r.profit=r.base-r.cost;r.hasCost=r.cost>0||costRows>0;

  r.errs=errs;r.items=items;
  r.hasInvalid=Object.keys(errs).some(function(k){return errs[k].kind==='inv'});
  r.hasReq=Object.keys(errs).some(function(k){return errs[k].kind==='req'});
  return r;
}
function linesFrom(c,q){
  var L=[{l:'Subtotal materiales',v:money(c.mat)},{l:'Subtotal mano de obra',v:money(c.lab)}];
  if(c.tras)L.push({l:'Traslado',v:money(c.tras)});
  if(c.herr)L.push({l:'Alquiler de herramientas',v:money(c.herr)});
  if(c.otros)L.push({l:'Otros gastos',v:money(c.otros)});
  L.push({l:'Subtotal general',v:money(c.subtotal),strong:true});
  if(c.disc>0)L.push({l:'Descuento'+(q.discount.type==='porc'&&c.discPct!=null?' ('+fmtQty(c.discPct)+'%)':''),v:'- '+money(c.disc)});
  if(q.tax.on&&!c.errs['t.name']&&!c.errs['t.pct']){
    L.push({l:'Subtotal con descuento',v:money(c.base),strong:true});
    L.push({l:'Impuesto: '+q.tax.name.trim()+' ('+fmtQty(c.taxPct)+'%)',v:money(c.taxAmt)});
  }
  if(c.visit>0)L.push({l:'Menos: visita de diagnóstico ya abonada',v:'- '+money(c.visit)});
  L.push({l:'TOTAL',v:money(c.total),total:true});
  if(c.advance>0){L.push({l:'Anticipo solicitado ('+fmtQty(c.advPct)+'%)',v:money(c.advance)});L.push({l:'Saldo a la finalización',v:money(c.total-c.advance)})}
  return L;
}

function wrapText(s,bold,size,maxW){

    if(par.trim()===''){out.push('');return}
    var words=par.split(/\s+/).filter(Boolean),line='';

      while(tw(w,bold,size)>maxW){var k=w.length;while(k>1&&tw(w.slice(0,k),bold,size)>maxW)k--;if(line){out.push(line);line=''}out.push(w.slice(0,k));w=w.slice(k)}

      if(tw(t,bold,size)<=maxW)line=t;else{if(line)out.push(line);line=w}
    });

  });

}

function deltaTxt(cur,prev){if(!(prev>0))return '';var p=Math.round((cur-prev)*100/prev);return '<span class="dl '+(p>=0?'up':'dn')+'">'+(p>=0?'↑ ':'↓ ')+Math.abs(p)+'%</span> vs. mes anterior'}
function lastBackup(){try{return localStorage.getItem('electropresupuesto.lastbackup')||''}catch(e){return ''}}
function moneyShort(p){p=Math.round(p);if(p>=1e6){var m=p/1e6;return '$ '+(m%1?m.toFixed(1).replace('.',','):m)+' M'}if(p>=1e3){var k=p/1e3;return '$ '+(k%1?k.toFixed(1).replace('.',','):k)+' mil'}return '$ '+p}
function chartHTML(days){
  var pts=[],i,j;for(i=days-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);pts.push({k:localISO(d),v:0})}
  DB.quotes.forEach(function(q){if(effStatus(q)==='borrador')return;var k=(q.createdAt||'').slice(0,10);for(j=0;j<pts.length;j++)if(pts[j].k===k){pts[j].v+=calc(q).total/100;break}});
  var max=0;pts.forEach(function(p){if(p.v>max)max=p.v});
  if(!max)return '<div class="empty" style="padding:30px 10px">'+ic('chart')+'<h3>Sin movimiento en este período</h3><p>Cuando crees presupuestos vas a ver acá cómo evolucionan.</p></div>';
  var raw=max/4,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),step=mag;[1,2,2.5,5,10].some(function(c){step=c*mag;return step>=raw});
  var top=step*4,W=window.innerWidth<700?340:520,H=window.innerWidth<700?230:260,L=58,R=14,T=14,B=30,iw=W-L-R,ih=H-T-B;
  function X(i){return L+(pts.length>1?i*iw/(pts.length-1):iw/2)}function Y(v){return T+ih-(v/top)*ih}
  var g='',line='',area='';
  for(i=0;i<=4;i++){var yv=step*i,y=Y(yv);g+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ch-t" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+moneyShort(yv)+'</text>'}
  pts.forEach(function(p,i){line+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' '});
  area=line+'L'+X(pts.length-1).toFixed(1)+' '+Y(0)+' L'+X(0).toFixed(1)+' '+Y(0)+' Z';
  var ev=days>10?5:1,dots='',lab='';
  pts.forEach(function(p,i){var pp=p.k.split('-');if(days<=10||i%ev===0||i===pts.length-1)lab+='<text class="ch-t" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+pp[2]+'/'+pp[1]+'</text>';
    if(days<=10)dots+='<circle class="ch-dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4"><title>'+fmtDate(p.k)+': '+money(Math.round(p.v*100))+'</title></circle>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Importe presupuestado por día en los últimos '+days+' días">'+g+'<path class="ch-area" d="'+area+'"/><path class="ch-line" d="'+line+'"/>'+dots+lab+'</svg>';
}

var DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function localISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function dateOf(iso){var p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addMonths(iso,n){var p=iso.split('-').map(Number),last=new Date(p[0],p[1]-1+n+1,0).getDate();return localISO(new Date(p[0],p[1]-1+n,Math.min(p[2],last)))}
function diffDays(a,b){return Math.round((dateOf(b)-dateOf(a))/864e5)}
function dayLabel(iso){var d=diffDays(todayISO(),iso);if(d===0)return 'Hoy';if(d===1)return 'Mañana';if(d===-1)return 'Ayer';var n=DAYS[dateOf(iso).getDay()];return n.charAt(0).toUpperCase()+n.slice(1)+' '+fmtDate(iso).slice(0,5)}
function wmN(q){var v=P(q.warrMonths);return (!v.err&&!v.empty&&v.v>0&&v.v===Math.round(v.v)&&v.v<=120)?v.v:0}
function warrInfo(q){var m=wmN(q);if(!m||(q.status!=='aceptado'&&q.status!=='pagado'))return null;var st=q.doneAt||(q.status==='pagado'&&q.paidAt?localISO(new Date(q.paidAt)):'');if(!st)return null;var end=addMonths(st,m);return {months:m,start:st,end:end,left:diffDays(todayISO(),end)}}
function updateQuote(id,fn){var q=DB.quotes.filter(function(x){return x.id===id})[0];if(!q)return null;fn(q);q.updatedAt=new Date().toISOString();saveDB();if(S.draft&&S.draft.id===id&&!S.dirty)S.draft=norm(clone(q));return q}

function intlPhone(t){t=(t||'').trim();if(!/^\+?\s*54/.test(t))return '';var d=t.replace(/\D/g,'');return d.length>=10?d:''}

function shopFiltered(){return DB.quotes.filter(function(q){if(q.status==='rechazado')return false;if(S.shopF==='aceptado')return q.status==='aceptado';if(S.shopF==='encurso')return q.status==='borrador'||q.status==='enviado'||q.status==='aceptado';return true}).sort(function(a,b){return (b.number||0)-(a.number||0)})}
function shopAgg(){
  var map={};
  DB.quotes.filter(function(q){return S.shopSel[q.id]}).forEach(function(q){q.mats.forEach(function(r){
    if(!r.desc.trim())return;var qty=P(r.qty);if(qty.err||qty.empty||qty.v<=0)return;
    var key=r.desc.trim().toLowerCase()+'|'+r.unit,e=map[key]||(map[key]={desc:r.desc.trim(),unit:r.unit,qty:0,n:{},cost:0,nocost:0});
    e.qty+=qty.v;e.n[q.id]=1;var cc=P(r.cost);if(!cc.err&&!cc.empty)e.cost+=Math.round(qty.v*Math.round(cc.v*100));else e.nocost++;
  })});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.desc.localeCompare(b.desc,'es')});
}

   '<div class="stat"><span class="k">Rechazados o vencidos</span><span class="v num">'+(s.rej+s.exp)+'</span><span class="n">'+s.rej+' rechazados · '+s.exp+' vencidos</span></div>'+

  var now=new Date(),rows=[],max=0;

    rows.push({l:MONTHS[d.getMonth()]+' '+String(d.getFullYear()).slice(2),t:tot});max=Math.max(max,tot)}
  h+='<section class="card"><div class="sec-h"><span class="ico">'+ic('chart')+'</span><h2>Presupuestado por mes</h2></div><div class="bars">'+rows.map(function(r){return '<div class="bar"><span>'+r.l+'</span><div class="tr"><div class="fi" style="width:'+(max?Math.max(r.t?1:0,r.t*100/max):0).toFixed(1)+'%"></div></div><span class="vl num">'+money(r.t)+'</span></div>'}).join('')+'</div><p class="hint" style="margin-top:10px">Suma de presupuestos enviados, aceptados, rechazados y vencidos, por fecha de creación.</p></section>';
  return h;
}

function commit(q){
  syncClient(q);
  if(!q.number){DB.counter++;q.number=DB.counter}
  q.updatedAt=new Date().toISOString();
  var i=DB.quotes.findIndex(function(x){return x.id===q.id}),cp=clone(q);
  if(i>=0)DB.quotes[i]=cp;else DB.quotes.push(cp);
  var ok=saveDB();if(ok){S.dirty=false;clearWorking()}return ok;
}
function openEditor(q){S.draft=q;S.dirty=false;S.tried=false;S.newClientOpen=false;S.waOpen=false;S.waText=null;go('edit')}
function firstError(){var el=$('[aria-invalid="true"]',main);if(el){el.scrollIntoView({block:'center'});el.focus()}}
async function doPdf(q,label){
  var errs=validateExport(q);
  if(errs.length){S.exportErr=errs;render();window.scrollTo(0,0);return}
  S.exportErr=null;
  if(q===S.draft&&(S.dirty||!isSaved(q))){if(!commit(q))return}
  var m=buildModel(q),logo=await prepLogo(DB.settings.logo);
  var bytes=buildPDF(m,logo);
  await saveFile(fileName(m),bytes,'application/pdf');
  if(S.view==='doc')render();
}

  if(t.id==='pk-q'){$('#pk-list').innerHTML=pkList(t.dataset.pkq,t.value);return}
  if(t.id==='dsearch'){S.dq=t.value;$('#dlist').innerHTML=doneInner();return}
  if(t.id==='qsearch'){S.q=t.value;var term=S.q.trim().toLowerCase();var list=DB.quotes.filter(function(q){if(q.status==='pagado')return false;var st=effStatus(q);if(S.f!=='todos'&&st!==S.f)return false;if(!term)return true;return numNo(q.number||0).indexOf(term.replace(/^n°?\s*/,''))>=0||(q.client.name||'').toLowerCase().indexOf(term)>=0}).sort(function(a,b){return (b.number||0)-(a.number||0)});$('#qlist').innerHTML=qListInner(list);return}
  if(t.id==='wa-text'){S.waText=t.value;var l=$('#wa-link');if(l)l.href=waHref(waPhone(S.draft.client.tel),t.value);return}
  if(S.view==='edit'&&S.draft){
    if(t.dataset.b){setPath(S.draft,t.dataset.b,t.type==='checkbox'?t.checked:t.value);afterEdit();return}
    if(t.dataset.row){var r=S.draft[t.dataset.row].filter(function(x){return x.id===t.dataset.id})[0];if(r){r[t.dataset.f]=t.value;afterEdit()}}
  }
  if(S.view==='settings'&&t.dataset.s&&S.settings)S.settings[t.dataset.s]=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.actChange==='pickClient'){pickClient(t);return}
  if(t.dataset.hr){S.homeRange=+t.value;render();return}
  if(t.dataset.shop){if(t.checked)S.shopSel[t.dataset.shop]=true;else delete S.shopSel[t.dataset.shop];var so=$('#shop-out');if(so)so.innerHTML=shopOut();return}
  if(t.id==='s-logo'&&t.files&&t.files[0]){
    var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
      var sc=Math.min(1,480/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.settings.logo=cv.toDataURL('image/png');render();toast('Logotipo cargado. Tocá Guardar datos para conservarlo.')};
      im.onerror=function(){toast('No se pudo leer esa imagen. Probá con PNG o JPG.')};im.src=fr.result};fr.readAsDataURL(t.files[0]);return}
  if(t.id==='restore'&&t.files&&t.files[0]){
    var rd=new FileReader();rd.onload=async function(){try{var d=JSON.parse(rd.result);if(!d||!Array.isArray(d.quotes)||!Array.isArray(d.clients))throw 0;
      var ok=await ask('Se reemplazan los datos actuales por los de la copia ('+d.quotes.length+' presupuestos, '+d.clients.length+' clientes). ¿Continuar?','Restaurar',true);if(!ok)return;
      var b=defaults();DB={version:1,counter:+d.counter||0,clients:d.clients,quotes:d.quotes.map(norm),catalog:Array.isArray(d.catalog)?d.catalog:[],templates:Array.isArray(d.templates)?d.templates:[],settings:Object.assign(b.settings,d.settings||{})};saveDB();S.settings=null;toast('Copia restaurada');go('home')}catch(x){toast('Ese archivo no es una copia válida de ElectroPresupuesto.')}};rd.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='catform'){
    var d=$('#ct-desc').value.trim(),er3=$('#ct-err'),pr=P($('#ct-price').value),tp=$('#ct-type').value;
    function bad3(m){er3.textContent=m;er3.hidden=false}
    if(!d)return bad3('Escribí la descripción.');if(pr.err)return bad3(pr.err);if(pr.empty)return bad3('Ingresá el precio (0 si no tiene costo).');var cp=P($('#ct-cost').value);if(cp.err)return bad3(cp.err);
    var o={id:S.catEdit||uid(),type:tp,desc:d,unit:tp==='mat'?$('#ct-unit').value:'',price:String(pr.v).replace('.',','),cost:(cp.empty?'':String(cp.v).replace('.',','))};
    var i=S.catEdit?DB.catalog.findIndex(function(x){return x.id===S.catEdit}):DB.catalog.findIndex(function(x){return x.type===tp&&x.desc.toLowerCase()===d.toLowerCase()});
    if(i>=0){o.id=DB.catalog[i].id;DB.catalog[i]=o}else DB.catalog.push(o);
    S.catEdit=null;saveDB();toast('Guardado en el catálogo.');render();return;
  }
  if(f.id==='cform'){
    var n=$('#c-name').value.trim(),er=$('#c-err'),em=$('#c-mail').value.trim();
    if(!n){er.textContent='Escribí el nombre del cliente.';er.hidden=false;$('#c-name').focus();return}
    if(em&&!/^\S+@\S+\.\S+$/.test(em)){er.textContent='El correo electrónico no parece válido.';er.hidden=false;return}
    var c=S.client||{};var o={id:c.id||uid(),name:n,tel:$('#c-tel').value.trim(),email:em,addr:$('#c-addr').value.trim(),notes:$('#c-notes').value.trim()};
    var i=DB.clients.findIndex(function(x){return x.id===o.id});if(i>=0)DB.clients[i]=o;else DB.clients.push(o);
    DB.quotes.forEach(function(q){if(q.clientId===o.id&&q.status==='borrador')syncClient(q)});
    saveDB();toast('Cliente guardado');go('clients',{client:null});
  }
  if(f.id==='sform'){
    var s=S.settings,er2=$('#s-err'),msgs=[];
    if(!s.nombre.trim()&&!s.comercial.trim())msgs.push('Escribí tu nombre o el nombre comercial.');
    if(s.email.trim()&&!/^\S+@\S+\.\S+$/.test(s.email.trim()))msgs.push('El correo electrónico no parece válido.');
    var v=P(s.validez);if(!v.empty&&(v.err||v.v<1||v.v>365||Math.round(v.v)!==v.v))msgs.push('La validez debe ser un número entero de días entre 1 y 365.');
    if(msgs.length){er2.innerHTML=msgs.map(esc).join('<br>');er2.hidden=false;return}
    DB.settings=clone(s);if(saveDB())toast('Datos guardados');render();
  }
});
window.addEventListener('beforeunload',function(){saveWorking()});

render();
})();
</script>
